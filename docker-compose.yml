services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >-
      sh -c 'if [ ! -d node_modules/next ]; then npm ci; fi &&
      npm run db:generate && npm run db:deploy && npm run dev'
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://terrabot:terrabot@postgres:5432/terrabot_backend
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - ./.docker/node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - terrabot

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: terrabot_backend
      POSTGRES_USER: terrabot
      POSTGRES_PASSWORD: terrabot
    ports:
      - "5433:5432"
    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrabot -d terrabot_backend"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default
      - terrabot

networks:
  terrabot:
    external: true
    name: terrabot
